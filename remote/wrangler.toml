# Xdeck phone remote: the installable app (public/) and the relay between phones and PCs (src/).
# Deploy: cd remote; wrangler deploy
name = "xdeck-remote"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
routes = [{ pattern = "xdeck.skale.club", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Pairing"]
